[project]
name = "persistent-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "langchain-core>=1.6.13",
    "langchain-groq>=1.1.3",
    "langchain-mongodb>=0.12.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
persistent-chatbot = "persistent_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
